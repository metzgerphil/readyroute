name: Private Staff Answer Speed Storage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readyroute-private-staff-storage
  cancel-in-progress: false
jobs:
  review-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add staff review progress while preserving original records
        run: node staff-testing/review-loop/deploy-storage.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-review-evidence
          path: staff-review-evidence/result.json
