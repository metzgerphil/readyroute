name: Private Staff Answer Speed Storage
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Owner-authorized increase of the shared staff AI allowance to five dollars total
        type: choice
        options: [raise-to-five]
        required: true
permissions:
  contents: read
concurrency:
  group: readyroute-private-staff-storage
  cancel-in-progress: false
jobs:
  allowance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the approved staff allowance without resetting usage
        run: node scripts/ops/raise-staff-allowance-20260908.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAFF_ALLOWANCE_ACTION: ${{ inputs.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-allowance-evidence
          path: staff-allowance-evidence/result.json
