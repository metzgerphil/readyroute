name: Authorized driver AI allowance 7 dollars
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readyroute-authorized-driver-allowance
  cancel-in-progress: false
jobs:
  limit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/driver-allowance7.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: driver-allowance7-evidence
          path: allowance-evidence/result.json
