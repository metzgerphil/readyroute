name: ReadyRoute Content Transition Storage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readyroute-private-staff-storage
  cancel-in-progress: false
jobs:
  install-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install service-only transition without changing source records
        run: node scripts/content-transition/install.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: content-install-evidence
          path: content-install-evidence/result.json
