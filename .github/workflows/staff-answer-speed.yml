name: Driver 2.5 history compatibility
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, initialize]
        default: initialize
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node phone25/migrate-history.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone25-history-evidence
          path: phone25/evidence/*
