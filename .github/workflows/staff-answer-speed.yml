name: ReadyRoute Offline Transition Storage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readyroute-private-staff-storage
  cancel-in-progress: false
jobs:
  install-offline-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact restricted function without source publication
        run: node scripts/offline-transition/install.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RR_OFFLINE_TRANSITION_SQL: ${{ secrets.RR_OFFLINE_TRANSITION_SQL }}
      - uses: actions/upload-artifact@v4
        with:
          name: offline-install-evidence
          path: offline-install-evidence/result.json
