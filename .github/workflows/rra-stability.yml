name: Ready Route Answers Stability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/services/driverHelp**'
      - 'backend/src/scripts/*DriverHelp*'
      - 'knowledge/**'
      - 'research/fedex-ground-driver-knowledge/knowledge/**'
      - 'research/fedex-ground-driver-knowledge/validation/**'
      - 'scripts/build-ready-route-knowledge.js'
      - 'scripts/validate-ready-route-knowledge.js'
      - '.github/workflows/rra-stability.yml'

permissions:
  contents: read

concurrency:
  group: rra-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stability-gate:
    name: RRA closed-loop stability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build, validate, and run three clean evaluation passes
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
        run: npm run knowledge:gate
