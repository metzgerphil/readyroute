name: Provision App Review Driver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Create or rotate App Review driver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out production source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install production dependencies
        run: npm ci --ignore-scripts --omit=dev
      - name: Provision dedicated reviewer login
        env:
          APP_REVIEW_DRIVER_PASSWORD: ${{ secrets.APP_REVIEW_DRIVER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/scripts/provisionAppReviewDriver.js
