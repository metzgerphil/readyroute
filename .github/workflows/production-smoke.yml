name: Production Smoke

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - production-deployed

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run production smoke
        env:
          SMOKE_BACKEND_URL: ${{ vars.SMOKE_BACKEND_URL || 'https://api.readyroute.org' }}
          SMOKE_PORTAL_URL: ${{ vars.SMOKE_PORTAL_URL || 'https://portal.readyroute.org' }}
          SMOKE_MANAGER_EMAIL: ${{ secrets.SMOKE_MANAGER_EMAIL }}
          SMOKE_MANAGER_PASSWORD: ${{ secrets.SMOKE_MANAGER_PASSWORD }}
          SMOKE_PASSWORD_RESET_EMAIL: ${{ secrets.SMOKE_PASSWORD_RESET_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run smoke:production
