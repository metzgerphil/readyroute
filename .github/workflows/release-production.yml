name: Release Production Backend

on:
  workflow_dispatch:
    inputs:
      run_knowledge_checks:
        description: Run the full RRA corpus/routing gate and canonical import
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'knowledge/**'
      - 'research/fedex-ground-driver-knowledge/validation/**'
      - 'scripts/build-ready-route-knowledge.js'
      - 'scripts/validate-ready-route-knowledge.js'
      - 'supabase/migrations/**'
      - '.github/workflows/release-production.yml'
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: readyroute-production-backend
  cancel-in-progress: false

jobs:
  changes:
    name: Detect RRA routing changes
    runs-on: ubuntu-latest
    outputs:
      knowledge: ${{ steps.filter.outputs.knowledge }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            knowledge:
              - 'knowledge/**'
              - 'research/fedex-ground-driver-knowledge/validation/**'
              - 'scripts/build-ready-route-knowledge.js'
              - 'scripts/validate-ready-route-knowledge.js'
              - 'backend/src/app.js'
              - 'backend/src/routes/driverHelp.js'
              - 'backend/src/routes/driverHelp.test.js'
              - 'backend/src/routes/managerDriverHelp.js'
              - 'backend/src/routes/managerDriverHelp.test.js'
              - 'backend/src/services/driverHelp*/**'
              - 'backend/src/services/driverHelp*'
              - 'backend/src/scripts/*DriverHelp*'
              - 'backend/src/scripts/*Regression*'
              - 'backend/src/scripts/*Stability*'

  verify:
    name: Verify Backend
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend unit tests
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
          JWT_SECRET: test-secret
          GOOGLE_MAPS_API_KEY: test-google-maps-key
          GOOGLE_CLOUD_PROJECT: ready-route-project
        run: npm run verify:schema && npm run check:launch && npm run test:unit

      - name: Run Ready Route Answers stability gate
        if: needs.changes.outputs.knowledge == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_knowledge_checks == true)
        working-directory: .
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
        run: npm run knowledge:gate

  migrate:
    name: Apply Supabase Migrations
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Verify migration configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF is not configured"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is not configured"; exit 1; }
          test -n "$SUPABASE_SERVICE_KEY" || { echo "SUPABASE_SERVICE_KEY is not configured"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Remove legacy delivery signature storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          bucket_url="${SUPABASE_URL%/}/storage/v1/bucket/signatures"
          auth_headers=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY")

          lookup_status="$(curl --silent --show-error --output /tmp/signature-bucket-lookup.json --write-out '%{http_code}' \
            "${auth_headers[@]}" "$bucket_url")"
          if [[ "$lookup_status" == "404" ]] || { [[ "$lookup_status" == "400" ]] && grep --quiet '"error":"Bucket not found"' /tmp/signature-bucket-lookup.json; }; then
            echo "Legacy signature bucket is already absent"
          elif [[ "$lookup_status" != "200" ]]; then
            cat /tmp/signature-bucket-lookup.json
            echo "Unable to inspect legacy signature bucket (HTTP $lookup_status)" >&2
            exit 1
          else
            empty_status="$(curl --silent --show-error --output /tmp/signature-bucket-empty.json --write-out '%{http_code}' \
              --request POST "${auth_headers[@]}" "$bucket_url/empty")"
            if [[ "$empty_status" != "200" ]]; then
              cat /tmp/signature-bucket-empty.json
              echo "Unable to empty legacy signature bucket (HTTP $empty_status)" >&2
              exit 1
            fi

            bucket_deleted=false
            for attempt in {1..12}; do
              delete_status="$(curl --silent --show-error --output /tmp/signature-bucket-delete.json --write-out '%{http_code}' \
                --request DELETE "${auth_headers[@]}" "$bucket_url")"
              if [[ "$delete_status" == "200" ]]; then
                bucket_deleted=true
                break
              fi
              if [[ "$delete_status" == "400" ]] && grep --quiet 'ResourceNotEmpty' /tmp/signature-bucket-delete.json; then
                echo "Waiting for signature object deletion to finish (attempt $attempt of 12)"
                sleep 5
                continue
              fi
              cat /tmp/signature-bucket-delete.json
              echo "Unable to delete legacy signature bucket (HTTP $delete_status)" >&2
              exit 1
            done
            if [[ "$bucket_deleted" != "true" ]]; then
              cat /tmp/signature-bucket-delete.json
              echo "Legacy signature bucket remained non-empty after waiting" >&2
              exit 1
            fi
            echo "Legacy delivery signature bucket removed"
          fi

      - name: Apply pending migrations
        run: supabase db push --linked --yes

      - name: Set up Node.js for canonical knowledge import
        if: needs.changes.outputs.knowledge == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_knowledge_checks == true)
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend import dependencies
        if: needs.changes.outputs.knowledge == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_knowledge_checks == true)
        working-directory: backend
        run: npm ci --ignore-scripts --omit=dev

      - name: Import canonical driver knowledge
        if: needs.changes.outputs.knowledge == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_knowledge_checks == true)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: backend
        run: npm run knowledge:import

  deploy:
    name: Deploy Cloud Run
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy immutable commit to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          source: backend
          env_vars: |-
            SOURCE_COMMIT=${{ github.sha }}
            NODE_ENV=production
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_MONTHLY_PRICE_ID=${{ vars.STRIPE_MONTHLY_PRICE_ID }}
            STRIPE_ANNUAL_PRICE_ID=${{ vars.STRIPE_ANNUAL_PRICE_ID }}
            STRIPE_SIGNUP_ENABLED=${{ vars.STRIPE_SIGNUP_ENABLED || 'false' }}
            STRIPE_SIGNUP_RETURN_URL=${{ vars.STRIPE_SIGNUP_RETURN_URL || 'https://readyroute.org/signup' }}
            RRA_COMPANY_PORTAL_URL=https://readyroute.org/portal
            RRA_IOS_APP_URL=https://apps.apple.com/us/app/ready-route/id6762488881
            STRIPE_PORTAL_RETURN_URL=https://readyroute.org/portal?view=billing
            READYROUTE_DRIVER_HELP_AI_INTERPRETATION_MODE=ACTIVE
            READYROUTE_DRIVER_HELP_ANSWER_MEMORY_AUDIT_RATE=0.05
            READYROUTE_DRIVER_HELP_AI_ENABLED=true
            READYROUTE_DRIVER_HELP_MODEL=gpt-5.6-luna
            READYROUTE_LIVE_BILLING_APPROVED=${{ vars.READYROUTE_LIVE_BILLING_APPROVED || 'false' }}
            STRIPE_TAX_ENABLED=${{ vars.STRIPE_TAX_ENABLED || 'false' }}
            STRIPE_TAX_REGISTRATIONS_CONFIRMED=${{ vars.STRIPE_TAX_REGISTRATIONS_CONFIRMED || 'false' }}
          env_vars_update_strategy: merge

      - name: Verify production release identity
        env:
          HEALTH_URL: ${{ vars.SMOKE_BACKEND_URL || 'https://api.readyroute.org' }}/health
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in {1..30}; do
            body="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"
            if [[ "$body" == *"$EXPECTED_COMMIT"* && "$body" == *'"compatible":true'* ]]; then
              echo "Production is serving $EXPECTED_COMMIT with a compatible database schema"
              exit 0
            fi
            sleep 10
          done
          echo "Production health did not report $EXPECTED_COMMIT with a compatible schema" >&2
          exit 1

      - name: Install production smoke dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --omit=dev

      - name: Provision dedicated production smoke manager
        env:
          SMOKE_MANAGER_EMAIL: ${{ secrets.SMOKE_MANAGER_EMAIL }}
          SMOKE_MANAGER_PASSWORD: ${{ secrets.SMOKE_MANAGER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: backend
        run: npm run smoke:provision-manager

      - name: Run public production smoke
        env:
          SMOKE_BACKEND_URL: ${{ vars.SMOKE_BACKEND_URL || 'https://api.readyroute.org' }}
          SMOKE_PORTAL_URL: ${{ vars.SMOKE_PORTAL_URL || 'https://portal.readyroute.org' }}
          SMOKE_MANAGER_EMAIL: ${{ secrets.SMOKE_MANAGER_EMAIL }}
          SMOKE_MANAGER_PASSWORD: ${{ secrets.SMOKE_MANAGER_PASSWORD }}
          SMOKE_PASSWORD_RESET_EMAIL: ${{ secrets.SMOKE_PASSWORD_RESET_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: backend
        run: npm run smoke:production

      - name: Release summary
        run: |
          echo "### ReadyRoute production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud Run URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migrations applied before backend deployment" >> "$GITHUB_STEP_SUMMARY"
