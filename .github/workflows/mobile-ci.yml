name: Mobile CI

on:
  pull_request:
    paths:
      - 'driver-app/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'driver-app/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-mobile:
    name: Test Driver App
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: driver-app

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npm run check

      - name: Test mobile app
        run: npm test

      - name: Audit mobile dependencies
        run: npm audit --audit-level=low

      - name: Export production iOS bundle
        env:
          EXPO_PUBLIC_API_URL: https://api.readyroute.org
          EXPO_PUBLIC_USE_LOCAL_API: 'false'
        run: npm run build:native:production
