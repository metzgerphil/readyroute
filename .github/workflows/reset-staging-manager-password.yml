name: Maintain Staging Access

on:
  workflow_dispatch:
    inputs:
      manager_email:
        description: Active staging manager email to reset
        required: false
        type: string
      driver_emails:
        description: Comma-separated staging driver emails to activate and invite
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  STAGING_SUPABASE_PROJECT_REF: xtzbjlmizmdfqelvhhwx
  STAGING_SUPABASE_URL: https://xtzbjlmizmdfqelvhhwx.supabase.co
  STAGING_BACKEND_URL: https://readyroute-api-staging-201632321692.us-west1.run.app

jobs:
  maintain-access:
    name: Maintain staging account access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --omit=dev

      - name: Validate maintenance request
        env:
          TARGET_MANAGER_EMAIL: ${{ inputs.manager_email }}
          TARGET_DRIVER_EMAILS: ${{ inputs.driver_emails }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_MANAGER_EMAIL//[[:space:]]/}" && -z "${TARGET_DRIVER_EMAILS//[[:space:]]/}" ]]; then
            echo 'Provide manager_email, driver_emails, or both.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Ensure staging invitation email delivery is configured
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update readyroute-api-staging \
            --project='${{ vars.GCP_PROJECT_ID }}' \
            --region='${{ vars.GCP_REGION }}' \
            --update-secrets='RESEND_API_KEY=RESEND_API_KEY:latest' \
            --update-env-vars='RESEND_FROM_EMAIL=ReadyRoute <info@readyroute.org>' \
            --quiet >/dev/null

      - name: Provision isolated staging automation manager
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          keys_url="https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/api-keys"
          keys_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$keys_url")"
          service_key="$(jq -r '.[] | select(.name == "service_role") | (.api_key // .key)' <<<"$keys_response")"
          test -n "$service_key" && test "$service_key" != "null"
          runtime_password="$(openssl rand -hex 24)"
          echo "::add-mask::$service_key"
          echo "::add-mask::$runtime_password"
          echo "STAGING_MANAGER_RUNTIME_PASSWORD=$runtime_password" >> "$GITHUB_ENV"
          SUPABASE_URL="$STAGING_SUPABASE_URL" SUPABASE_SERVICE_KEY="$service_key" \
            STAGING_MANAGER_BOOTSTRAP_PASSWORD="$runtime_password" \
            node src/scripts/provisionStagingManager.js

      - name: Prepare one-time reset link
        if: ${{ inputs.manager_email != '' && !startsWith(inputs.manager_email, 'driver-invites:') }}
        env:
          TARGET_MANAGER_EMAIL: ${{ inputs.manager_email }}
        shell: bash
        run: |
          set -euo pipefail
          login_payload="$(jq -n \
            --arg email 'rra-staging-automation@readyroute.test' \
            --arg password "$STAGING_MANAGER_RUNTIME_PASSWORD" \
            '{email: $email, password: $password}')"
          login_response="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$login_payload" \
            "$STAGING_BACKEND_URL/auth/manager/login")"
          manager_token="$(jq -r '.token // empty' <<<"$login_response")"
          test -n "$manager_token"
          echo "::add-mask::$manager_token"

          managers_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $manager_token" \
            "$STAGING_BACKEND_URL/manager/manager-users")"
          manager_id="$(jq -r --arg email "${TARGET_MANAGER_EMAIL,,}" \
            '.manager_users[] | select((.email | ascii_downcase) == $email) | .id' \
            <<<"$managers_response" | head -n 1)"
          test -n "$manager_id" || { echo 'The requested active manager was not found in the staging workspace.' >&2; exit 1; }

          reset_response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $manager_token" \
            "$STAGING_BACKEND_URL/manager/manager-users/$manager_id/password-reset")"
          reset_url="$(jq -r '.reset_url // empty' <<<"$reset_response")"
          test -n "$reset_url" || { echo 'The staging server did not return a reset link.' >&2; exit 1; }
          echo "::add-mask::$reset_url"
          printf '%s\n' "$reset_url" > /tmp/readyroute-staging-reset-url.txt

      - name: Activate and invite staging drivers
        if: ${{ inputs.driver_emails != '' || startsWith(inputs.manager_email, 'driver-invites:') }}
        env:
          TARGET_MANAGER_EMAIL: ${{ inputs.manager_email }}
          TARGET_DRIVER_EMAILS: ${{ inputs.driver_emails }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_MANAGER_EMAIL" == driver-invites:* ]]; then
            TARGET_DRIVER_EMAILS="${TARGET_MANAGER_EMAIL#driver-invites:}"
          fi
          login_payload="$(jq -n \
            --arg email 'rra-staging-automation@readyroute.test' \
            --arg password "$STAGING_MANAGER_RUNTIME_PASSWORD" \
            '{email: $email, password: $password}')"
          login_response="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$login_payload" \
            "$STAGING_BACKEND_URL/auth/manager/login")"
          manager_token="$(jq -r '.token // empty' <<<"$login_response")"
          test -n "$manager_token"
          echo "::add-mask::$manager_token"

          IFS=',' read -ra requested_emails <<<"$TARGET_DRIVER_EMAILS"
          for requested_email in "${requested_emails[@]}"; do
            normalized_email="$(tr '[:upper:]' '[:lower:]' <<<"$requested_email" | xargs)"
            test -n "$normalized_email" || continue
            echo "::add-mask::$normalized_email"

            drivers_response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $manager_token" \
              "$STAGING_BACKEND_URL/manager/drivers")"
            matching_count="$(jq -r --arg email "$normalized_email" \
              '[.drivers[] | select((.email | ascii_downcase) == $email)] | length' \
              <<<"$drivers_response")"
            test "$matching_count" = '1' || {
              echo 'A requested staging driver was not found exactly once.' >&2
              exit 1
            }
            driver_id="$(jq -r --arg email "$normalized_email" \
              '.drivers[] | select((.email | ascii_downcase) == $email) | .id' \
              <<<"$drivers_response")"
            is_active="$(jq -r --arg email "$normalized_email" \
              '.drivers[] | select((.email | ascii_downcase) == $email) | .is_active' \
              <<<"$drivers_response")"

            if [[ "$is_active" != 'true' ]]; then
              curl --fail-with-body --silent --show-error \
                -X PATCH \
                -H "Authorization: Bearer $manager_token" \
                -H 'Content-Type: application/json' \
                --data '{"is_active":true}' \
                "$STAGING_BACKEND_URL/manager/drivers/$driver_id/status" >/dev/null
            fi

            invite_response="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $manager_token" \
              "$STAGING_BACKEND_URL/manager/drivers/$driver_id/invite")"
            email_delivery="$(jq -r '.email_delivery // empty' <<<"$invite_response")"
            test "$email_delivery" = 'sent' || {
              echo 'The ReadyRoute email provider did not accept a requested driver invitation.' >&2
              exit 1
            }

            verified_response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $manager_token" \
              "$STAGING_BACKEND_URL/manager/drivers")"
            verified_active="$(jq -r --arg email "$normalized_email" \
              '.drivers[] | select((.email | ascii_downcase) == $email) | .is_active' \
              <<<"$verified_response")"
            verified_status="$(jq -r --arg email "$normalized_email" \
              '.drivers[] | select((.email | ascii_downcase) == $email) | .access_status' \
              <<<"$verified_response")"
            test "$verified_active" = 'true'
            test "$verified_status" = 'invited'
            echo 'Verified one active staging driver and provider-accepted invitation.'
          done

      - name: Preserve reset link briefly
        if: ${{ inputs.manager_email != '' && !startsWith(inputs.manager_email, 'driver-invites:') }}
        uses: actions/upload-artifact@v6
        with:
          name: readyroute-staging-manager-reset-${{ github.run_id }}
          path: /tmp/readyroute-staging-reset-url.txt
          if-no-files-found: error
          retention-days: 1
