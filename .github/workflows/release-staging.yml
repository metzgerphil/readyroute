name: Release Staging Driver Help

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: readyroute-staging-driver-help
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: xtzbjlmizmdfqelvhhwx
  STAGING_SUPABASE_URL: https://xtzbjlmizmdfqelvhhwx.supabase.co
  STAGING_BACKEND_URL: https://readyroute-api-staging-201632321692.us-west1.run.app
  STAGING_CLOUD_RUN_SERVICE: readyroute-api-staging

jobs:
  release:
    name: Verify, migrate, import, and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and verify backend
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
          JWT_SECRET: test-secret
          GOOGLE_MAPS_API_KEY: test-google-maps-key
          GOOGLE_CLOUD_PROJECT: ready-route-project
        run: npm ci && npm run verify:schema && npm run check:launch && npm run test:unit

      - name: Apply pending staging migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          query_url="https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query"
          headers=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          state_payload='{"query":"select version from public.readyroute_schema_state where id = true"}'
          state_response="$(curl --fail-with-body --silent --show-error --request POST "${headers[@]}" --data "$state_payload" "$query_url")"
          current_version="$(jq -r '.[0].version // "0"' <<<"$state_response")"
          echo "Staging schema starts at $current_version"

          for migration in supabase/migrations/202608*.sql; do
            version="$(basename "$migration" | cut -d_ -f1)"
            if [[ "$version" > "$current_version" ]]; then
              echo "Applying staging migration $version"
              jq -Rs '{query: .}' < "$migration" > /tmp/staging-migration.json
              migration_response=''
              if ! migration_response="$(curl --fail-with-body --silent --show-error --request POST "${headers[@]}" \
                --data @/tmp/staging-migration.json "$query_url")"; then
                echo "$migration_response" >&2
                exit 1
              fi
              current_version="$version"
            fi
          done
          test "$current_version" = "20260815130000"

      - name: Import canonical knowledge into staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          keys_url="https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/api-keys"
          keys_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$keys_url")"
          service_key="$(jq -r '.[] | select(.name == "service_role") | (.api_key // .key)' <<<"$keys_response")"
          test -n "$service_key" && test "$service_key" != "null"
          echo "::add-mask::$service_key"
          SUPABASE_URL="$STAGING_SUPABASE_URL" SUPABASE_SERVICE_KEY="$service_key" npm run knowledge:import

      - name: Provision the staging manager
        if: ${{ secrets.STAGING_MANAGER_BOOTSTRAP_EMAIL != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_MANAGER_BOOTSTRAP_EMAIL: ${{ secrets.STAGING_MANAGER_BOOTSTRAP_EMAIL }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          keys_url="https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/api-keys"
          keys_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$keys_url")"
          service_key="$(jq -r '.[] | select(.name == "service_role") | (.api_key // .key)' <<<"$keys_response")"
          test -n "$service_key" && test "$service_key" != "null"
          echo "::add-mask::$service_key"
          SUPABASE_URL="$STAGING_SUPABASE_URL" SUPABASE_SERVICE_KEY="$service_key" node src/scripts/provisionStagingManager.js

      - name: Calculate expected staging corpus counts
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          summary="$(node src/scripts/importDriverKnowledge.js --dry-run)"
          echo "EXPECTED_ANSWERS_SOURCES=$(jq -r '.sources' <<<"$summary")" >> "$GITHUB_ENV"
          echo "EXPECTED_ANSWERS_RECORDS=$(jq -r '.indexed_records' <<<"$summary")" >> "$GITHUB_ENV"
          echo "EXPECTED_ANSWERS_EVIDENCE=$(jq -r '.evidence_links' <<<"$summary")" >> "$GITHUB_ENV"
          echo "EXPECTED_ANSWERS_PUBLISHED=$(jq -r '.published_production_eligible_records' <<<"$summary")" >> "$GITHUB_ENV"

      - name: Verify the staging Answers corpus matches the canonical release
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          query_url="https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query"
          headers=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          query='{"query":"select (select count(*) from public.driver_help_knowledge_sources) as sources, (select count(*) from public.driver_help_knowledge_records) as records, (select count(*) from public.driver_help_knowledge_records where is_published = true) as published, (select count(*) from public.driver_help_knowledge_record_sources) as evidence_links, (select count(*) from public.driver_help_interactions) as interactions"}'
          response="$(curl --fail-with-body --silent --show-error --request POST "${headers[@]}" --data "$query" "$query_url")"
          test "$(jq -r '.[0].sources' <<<"$response")" -ge "$EXPECTED_ANSWERS_SOURCES"
          test "$(jq -r '.[0].records' <<<"$response")" -ge "$EXPECTED_ANSWERS_RECORDS"
          test "$(jq -r '.[0].published' <<<"$response")" = "$EXPECTED_ANSWERS_PUBLISHED"
          test "$(jq -r '.[0].evidence_links' <<<"$response")" -ge "$EXPECTED_ANSWERS_EVIDENCE"
          test "$(jq -r '.[0].interactions' <<<"$response")" -ge "0"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy staging Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ env.STAGING_CLOUD_RUN_SERVICE }}
          source: backend
          env_vars: |-
            SOURCE_COMMIT=${{ github.sha }}
            NODE_ENV=production
            READYROUTE_DRIVER_HELP_AI_ENABLED=false
            MANAGER_PORTAL_URL=https://ready-route-project--rra-test-mlshz0rb.web.app
          env_vars_update_strategy: merge

      - name: Verify staging release identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in {1..30}; do
            body="$(curl --fail --silent --show-error "$STAGING_BACKEND_URL/health" || true)"
            if [[ "$body" == *"$EXPECTED_COMMIT"* && "$body" == *'"current":"20260815130000"'* && "$body" == *'"compatible":true'* ]]; then
              echo "Staging is serving $EXPECTED_COMMIT with current canonical knowledge schema"
              exit 0
            fi
            sleep 10
          done
          echo "Staging health did not report the expected release and schema" >&2
          exit 1

      - name: Release summary
        run: |
          echo "### ReadyRoute staging driver-help release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud Run URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical corpus: $EXPECTED_ANSWERS_RECORDS indexed records, $EXPECTED_ANSWERS_PUBLISHED published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database counts verified against the generated v2 release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend remains fail-closed for pending or unmatched questions" >> "$GITHUB_STEP_SUMMARY"
