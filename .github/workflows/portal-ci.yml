name: Portal CI

on:
  pull_request:
    paths:
      - 'manager-portal/**'
      - '.github/workflows/portal-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'manager-portal/**'
      - '.github/workflows/portal-ci.yml'

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-portal:
    name: Test Manager Portal
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: manager-portal

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager-portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci

      - name: Build portal
        env:
          VITE_API_URL: https://readyroute-backend-production.up.railway.app
        run: npm run build
