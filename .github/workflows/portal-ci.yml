name: Portal CI

on:
  pull_request:
    paths:
      - 'manager-portal/**'
      - '.github/workflows/portal-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'manager-portal/**'
      - '.github/workflows/portal-ci.yml'

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-portal:
    name: Test Manager Portal
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: manager-portal

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager-portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci

      - name: Lint portal
        run: npm run lint

      - name: Test portal utilities
        run: npm test

      - name: Audit portal dependencies
        run: npm audit --audit-level=low

      - name: Build portal
        env:
          VITE_API_URL: https://api.readyroute.org
        run: npm run build
