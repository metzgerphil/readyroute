name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'knowledge/**'
      - 'research/fedex-ground-driver-knowledge/validation/**'
      - 'scripts/build-ready-route-knowledge.js'
      - 'scripts/validate-ready-route-knowledge.js'
      - 'scripts/release-backend.sh'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'knowledge/**'
      - 'research/fedex-ground-driver-knowledge/validation/**'
      - 'scripts/build-ready-route-knowledge.js'
      - 'scripts/validate-ready-route-knowledge.js'
      - 'scripts/release-backend.sh'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect RRA routing changes
    runs-on: ubuntu-latest
    outputs:
      knowledge: ${{ steps.filter.outputs.knowledge }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            knowledge:
              - 'knowledge/**'
              - 'research/fedex-ground-driver-knowledge/validation/**'
              - 'scripts/build-ready-route-knowledge.js'
              - 'scripts/validate-ready-route-knowledge.js'
              - 'backend/src/app.js'
              - 'backend/src/routes/driverHelp.js'
              - 'backend/src/routes/driverHelp.test.js'
              - 'backend/src/routes/managerDriverHelp.js'
              - 'backend/src/routes/managerDriverHelp.test.js'
              - 'backend/src/services/driverHelp*/**'
              - 'backend/src/services/driverHelp*'
              - 'backend/src/scripts/*DriverHelp*'
              - 'backend/src/scripts/*Regression*'
              - 'backend/src/scripts/*Stability*'

  test-backend:
    name: Test Backend
    needs: changes
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend unit tests
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
          JWT_SECRET: test-secret
        run: npm run test:unit

      - name: Run Ready Route Answers stability gate
        if: needs.changes.outputs.knowledge == 'true'
        working-directory: .
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
        run: npm run knowledge:gate

      - name: Skip backend e2e in GitHub CI for now
        run: echo "Backend e2e remains a local/release check until GitHub test secrets are configured."
