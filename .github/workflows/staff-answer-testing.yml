name: Private Staff Answer Testing Storage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Initialize the isolated staff schema, or verify its current state
        type: choice
        required: true
        default: verify
        options:
          - verify
          - initialize

permissions:
  contents: read

concurrency:
  group: readyroute-private-staff-storage
  cancel-in-progress: false

jobs:
  private-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Initialize or verify only the private staff schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAFF_STORAGE_MODE: ${{ inputs.mode }}
        run: node staff-testing/deploy-storage.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-staff-storage-${{ github.run_id }}
          path: staff-testing/evidence/storage-*.json
          if-no-files-found: ignore
