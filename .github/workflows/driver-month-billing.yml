name: Driver month billing

on:
  schedule:
    - cron: '45 16 1 * *'
  workflow_dispatch:

jobs:
  bill:
    runs-on: ubuntu-latest
    steps:
      - name: Accrue active drivers and invoice the completed month
        env:
          READYROUTE_API_URL: ${{ secrets.READYROUTE_PRODUCTION_API_URL }}
          READYROUTE_WORKER_SECRET: ${{ secrets.READYROUTE_INTERNAL_WORKER_SECRET }}
        run: |
          curl --fail-with-body --retry 2 \
            -X POST "$READYROUTE_API_URL/internal/driver-month-billing" \
            -H "Authorization: Bearer $READYROUTE_WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
